<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobBor · HR login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f3f4f8;--surface:#fff;--border:#e6e8ef;--text:#12141c;--muted:#6b7080;--accent:#4680e5;--accent-soft:#eef0ff;--bad:#dc3d4a;--bad-soft:#fdecee}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:grid;place-items:center;padding:16px;font-size:14px;line-height:1.45}
  .card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:28px;
    box-shadow:0 1px 2px rgba(18,20,28,.04),0 6px 20px rgba(18,20,28,.05);padding:32px 28px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .brand img{width:34px}
  .brand span{font-weight:700;font-size:18px;letter-spacing:-.02em}
  h1{font-size:22px;letter-spacing:-.02em;margin-bottom:4px}
  p.sub{color:var(--muted);margin-bottom:22px}
  label{display:block;font-weight:600;font-size:13px;margin-bottom:8px}
  .field{margin-bottom:16px}
  input{width:100%;height:46px;border:1px solid var(--border);border-radius:14px;padding:0 14px;font:inherit;
    background:var(--surface);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .err{display:none;margin-bottom:14px;padding:10px 14px;border-radius:14px;background:var(--bad-soft);color:var(--bad);font-weight:500}
  .err.show{display:block}
  button{width:100%;height:46px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:600;
    cursor:pointer;box-shadow:0 6px 16px rgba(79,70,229,.28);transition:background .15s}
  button:hover{background:#4338ca}
  button:disabled{opacity:.6;cursor:not-allowed}
</style>
</head>
<body>
  <form class="card" id="loginForm" novalidate>
    <div class="brand"><img src="/public/logo/logo.png" alt="" onerror="this.remove()"><span>JobBor</span></div>
    <h1>HR login</h1>
    <p class="sub">Sign in to manage vacancies and candidates.</p>
    <div class="err" id="err" role="alert"></div>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" id="submit">Sign in</button>
  </form>

<script>
  // Where the dashboard lives (the file/page you serve admin.html from)
  const ADMIN_URL = '/admin.html';

  const form = document.getElementById('loginForm');
  const err = document.getElementById('err');
  const submit = document.getElementById('submit');

  function showError(msg){ err.textContent = msg; err.classList.add('show'); }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    err.classList.remove('show');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password){ showError('Enter username and password'); return; }

    submit.disabled = true;
    try {
      const res = await fetch('/api/hr/login', {
        method:'POST',
        credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:username, password:password})
      });
      if (res.ok){ window.location.href = ADMIN_URL; return; }
      let msg = 'Login failed (' + res.status + ')';
      try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (x) {}
      showError(msg);
    } catch (x) {
      showError('Network error — check your connection');
    } finally {
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
